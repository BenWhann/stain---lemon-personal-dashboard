    const { useState, useEffect, useCallback } = React;

    function useStickyState(defaultValue, key) {
      const [value, setValue] = useState(() => {
        const stickyValue = window.localStorage.getItem(key);
        return stickyValue !== null ? JSON.parse(stickyValue) : defaultValue;
      });
      useEffect(() => {
        window.localStorage.setItem(key, JSON.stringify(value));
      }, [key, value]);
      return [value, setValue];
    }

    // Robust CSV parser supporting quotes, commas, and multiline values
    function parseCSV(text) {
      const p = [];
      let row = [''];
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        let c = text[i];
        let next = text[i + 1];
        if (c === '"') {
          if (inQuotes && next === '"') {
            row[row.length - 1] += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (c === ',' && !inQuotes) {
          row.push('');
        } else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && next === '\n') i++;
          p.push(row);
          row = [''];
        } else {
          row[row.length - 1] += c;
        }
      }
      if (row.length > 1 || row[0] !== '') p.push(row);
      return p;
    }

        '- Stain is keeping guard from the study desk 🐈‍⬛',

      const syncFromGoogleSheet = useCallback(async (manual = false) => {

        try {
          const res = await fetch(sheetUrl);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const csvText = await res.text();
          const rows = parseCSV(csvText);

          let headerIdx = -1;
          for (let i = 0; i < rows.length; i++) {
            if (rows[i].some(cell => cell.trim().toLowerCase() === 'task title')) {
              headerIdx = i;
              break;
            }
          }

          if (headerIdx === -1) {
            throw new Error('Header row not found in CSV. Ensure tab is "Active Tasks & Deadlines".');
          }

          const headers = rows[headerIdx].map(h => h.trim().toLowerCase());
          const titleCol = headers.indexOf('task title');
          const catCol = headers.indexOf('category');
          const prioCol = headers.indexOf('priority');
          const dueCol = headers.indexOf('due date');
          const srcCol = headers.indexOf('source');
          const statusCol = headers.indexOf('status');
          const notesCol = headers.indexOf('notes');

            parsedTasks.push({
              id: existing ? existing.id : Date.now() + i,
              title,
              category,
              priority,
              due,
              source,
              completed,
              notes,
            });

            const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const firstDayIndex = new Date(year, month, 1).getDay();

      const prevMonth = () => setViewDate(new Date(year, month - 1, 1));
      const nextMonth = () => setViewDate(new Date(year, month + 1, 1));
      const goToToday = () => {
        const d = new Date(2026, 8, 3);
        setViewDate(d);
        setSelectedDateStr('2026-09-03');
      };

      const handleAddEvent = (e) => {
        e.preventDefault();
        if (!newTitle.trim()) return;
        const ev = {
          id: Date.now(),
          title: newTitle.trim(),
          time: newTime,
          date: selectedDateStr,
          cal: newCategory,
          icon: newCategory === 'Academic' ? '🎓' : newCategory === 'Work' ? '💼' : newCategory === 'Bills' ? '💳' : newCategory === 'Wellness' ? '🧘‍♀️' : '📅',

      const deleteEvent = (id) => {

      const calendarDays = [];
      for (let i = 0; i < firstDayIndex; i++) {
        calendarDays.push({ blank: true, key: `blank-${i}` });

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

                        <div className="flex items-center justify-between">

    // --- Task Manager ---
    function CatTaskManager({ tasks, setTasks, onSync }) {
      const [filter, setFilter] = useState('All');
      const [newTitle, setNewTitle] = useState('');
      const [newCategory, setNewCategory] = useState('Grad School');
      const [newPriority, setNewPriority] = useState('Purr-fect');
      const [newDue, setNewDue] = useState('2026-09-04');
      const [isAdding, setIsAdding] = useState(false);

      const addTask = (e) => {
        e.preventDefault();
        if (!newTitle.trim()) return;
        const newTask = {
          id: Date.now(),
          title: newTitle.trim(),
          category: newCategory,
          priority: newPriority,
          due: newDue || '2026-09-04',
          source: 'User Entered',
          completed: false,
          notes: '',
        };
        setTasks([newTask, ...tasks]);
        setNewTitle('');
        setIsAdding(false);
      };

      const toggleTask = (id) => {
        setTasks(tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
      };

      const deleteTask = (id) => {
        setTasks(tasks.filter(t => t.id !== id));
      };

      const filteredTasks = tasks.filter(t => {
        if (filter === 'All') return true;
        if (filter === 'Active') return !t.completed;
        if (filter === 'Completed') return t.completed;
        return t.category === filter;
      });

      const priorityBadge = (p) => {
        if (p === 'Zoomies' || p === 'High') {
          return 'bg-rose-100 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 border-rose-200 dark:border-rose-900';
        }
        if (p === 'Purr-fect' || p === 'Medium') {
          return 'bg-amber-100 dark:bg-amber-950/60 text-amber-700 dark:text-amber-400 border-amber-200 dark:border-amber-900';
        }
        return 'bg-emerald-100 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-400 border-emerald-200 dark:border-emerald-900';
      };

      return (
        <div className="bg-white dark:bg-stone-900 p-6 rounded-3xl border border-cat-200/70 dark:border-stone-800 shadow-sm">
          <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
            <div className="flex items-center gap-2">
              <span className="text-xl">📋</span>
              <h2 className="text-lg font-bold font-cozy">Tasks & Clinical Deadlines</h2>
              <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-cat-100 dark:bg-stone-800 text-cat-700 dark:text-cat-300">
                {tasks.filter(t => !t.completed).length} pending
              </span>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={onSync}
                title="Pull latest tasks from Google Sheet"
                className="text-xs font-bold px-3 py-1.5 rounded-2xl bg-cat-50 dark:bg-stone-800 hover:bg-cat-100 border border-cat-200 dark:border-stone-700 text-cat-700 dark:text-cat-300 transition-all flex items-center gap-1 cursor-pointer"
              >
                <span>🔄</span> Sync Sheet
              </button>

    // --- Habit Tracker ---
    function CatHabitTracker({ habits, setHabits }) {
      const daysOfWeek = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
      const toggleDay = (habitId, dayIndex) => {
        setHabits(habits.map(h => {
          if (h.id === habitId) {
            const newDays = [...h.days];
            newDays[dayIndex] = !newDays[dayIndex];
            const newStreak = newDays.filter(Boolean).length;
            return { ...h, days: newDays, streak: newStreak };
          }
          return h;
        }));
      };

      const addHabit = () => {
        const name = prompt('Habit name:');
        if (!name) return;
        setHabits([...habits, { id: Date.now(), name, icon: '🐾', days: [false, false, false, false, false, false, false], streak: 0 }]);
      };

      return (
        <div className="bg-white dark:bg-stone-900 p-6 rounded-3xl border border-cat-200/70 dark:border-stone-800 shadow-sm">
          <div className="flex items-center justify-between mb-4">
            <div className="flex items-center gap-2">
              <span className="text-xl">🐾</span>
              <h2 className="text-lg font-bold font-cozy">Daily Paw-gress Habits</h2>
            </div>
            <button onClick={addHabit} className="text-xs font-bold text-cat-600 dark:text-cat-400 hover:underline cursor-pointer">
              + New Habit
            </button>
          </div>
          <div className="space-y-3">
            {habits.map(h => (
              <div key={h.id} className="flex flex-col sm:flex-row sm:items-center justify-between p-3.5 rounded-2xl bg-cat-50/50 dark:bg-stone-800/40 border border-cat-100 dark:border-stone-800 gap-2">
                <div className="flex items-center gap-2 min-w-0">
                  <span className="text-lg">{h.icon || '🐾'}</span>
                  <div>
                    <p className="text-xs sm:text-sm font-bold truncate">{h.name}</p>
                    <p className="text-[10px] text-cat-600 dark:text-cat-400 font-semibold">🔥 {h.streak} day streak</p>
                  </div>
                </div>
                <div className="flex items-center gap-1.5 self-end sm:self-auto">
                  {h.days.map((done, idx) => (
                    <button
                      key={idx}
                      onClick={() => toggleDay(h.id, idx)}
                      className={`w-8 h-8 rounded-xl text-xs font-extrabold transition-all flex items-center justify-center cursor-pointer ${done ? 'bg-gradient-to-tr from-cat-500 to-amber-400 text-white shadow-sm shadow-cat-500/30 scale-105' : 'bg-white dark:bg-stone-700 text-stone-400 hover:bg-cat-100'}`}
                      title={`${daysOfWeek[idx]}: ${done ? 'Completed' : 'Incomplete'}`}
                    >
                      {done ? '🐾' : daysOfWeek[idx]}
                    </button>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

      const [seconds, setSeconds] = useState(25 * 60);

        let timer = null;
        if (isActive && seconds > 0) {
          timer = setInterval(() => setSeconds(s => s - 1), 1000);

          setIsActive(false);
          alert('Meow! Focus session complete. Lemon & Stain approve! 🐾');

        return () => clearInterval(timer);
      }, [isActive, seconds]);

      const formatTime = (s) => {
        const m = Math.floor(s / 60);

        return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;

      return (
        <div className="bg-gradient-to-br from-cat-500 to-amber-600 text-white p-6 rounded-3xl shadow-md space-y-4">

                  <h3 className="text-sm font-bold text-cat-800 dark:text-cat-300">Google Sheet Dynamic Feed Connection</h3>
                  <p className="text-[11px] text-stone-500 dark:text-stone-400">
                    Status: <span className="font-bold text-cat-600 dark:text-cat-400">{syncStatus}</span> {lastSyncTime && `• Last Synced: ${lastSyncTime}`}
                  </p>
                </div>
              </div>
              <label className="flex items-center gap-2 text-xs font-semibold text-stone-600 dark:text-stone-300 cursor-pointer">
                <input
                  type="checkbox"
                  checked={autoSync}
                  onChange={(e) => setAutoSync(e.target.checked)}
                  className="rounded text-cat-500 focus:ring-cat-400"
                />
                Auto-sync on page load
              </label>
            </div>

            <div>
              <label className="text-[11px] font-bold text-stone-600 dark:text-stone-400 block mb-1">
                Connected Sheet CSV / Web Feed URL:
              </label>
              <input
                type="text"
                value={sheetUrl}
                onChange={(e) => setSheetUrl(e.target.value)}
                placeholder="Google Sheet CSV Export or Published Web URL"
                className="w-full text-xs p-2.5 rounded-xl bg-white dark:bg-stone-900 border border-cat-200 dark:border-stone-700 focus:outline-none focus:ring-2 focus:ring-cat-400 font-mono"
              />
            </div>

            <div className="flex items-center justify-between text-[11px] text-stone-500 dark:text-stone-400 pt-1 flex-wrap gap-2">
              <span>
                💡 Target: <strong>Personal Dashboard - Master Task Tracker</strong>
              </span>
              <a
                href="https://docs.google.com/spreadsheets/d/14KDi1BMtDPFdYsReC31bNAj-uU3CR0VvcUXVg1XR-lE/edit"
                target="_blank"
                rel="noreferrer"
                className="text-cat-600 dark:text-cat-400 font-bold hover:underline flex items-center gap-1"
              >
                Open Google Sheet in Drive →
              </a>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {integrations.map((item, idx) => (
              <div key={idx} className="p-4 rounded-2xl border border-cat-100 dark:border-stone-800 bg-cat-50/40 dark:bg-stone-800/30 flex items-start gap-4">
                <div className="text-2xl p-2 rounded-2xl bg-white dark:bg-stone-800 shadow-sm">{item.icon}</div>
                <div className="flex-1">
                  <div className="flex items-center justify-between">
                    <h4 className="text-sm font-bold">{item.name}</h4>
                    <span className="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-emerald-100 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-400">
                      {item.status}
                    </span>
                  </div>
                  <p className="text-xs text-stone-500 dark:text-stone-400 mt-1">{item.desc}</p>
                </div>
              </div>
            ))}
          </div>

          <div className="p-4 rounded-2xl bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900 text-xs text-amber-800 dark:text-amber-300">
            🐾 <strong>Dynamic GitHub Pages Note:</strong> When Gemini Spark processes emails in the background, it adds the new tasks directly to your Master Google Sheet. Whenever you open or refresh your GitHub Pages dashboard, it fetches the newest tasks automatically!
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
