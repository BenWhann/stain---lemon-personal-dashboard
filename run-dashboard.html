    // --- Web Audio API Synthesized Crystal Bell Chime ---
    let audioCtx = null;
    function playPurrChime() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        if (!audioCtx) audioCtx = new AudioContextClass();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        // 528 Hz Solfeggio Love frequency + 1056 Hz harmonic overtone
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(528, now);
        gain1.gain.setValueAtTime(0, now);
        gain1.gain.linearRampToValueAtTime(0.35, now + 0.04);
        gain1.gain.exponentialRampToValueAtTime(0.0001, now + 2.2);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);

        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(1056, now);
        gain2.gain.setValueAtTime(0, now);
        gain2.gain.linearRampToValueAtTime(0.15, now + 0.02);
        gain2.gain.exponentialRampToValueAtTime(0.0001, now + 1.4);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 2.3);
        osc2.stop(now + 1.5);
      } catch (e) {
        console.warn('Audio chime notice:', e);
      }
    }

    // --- Local Persistence Hook ---
    function useStickyState(defaultValue, key) {
      const [value, setValue] = useState(() => {
        try {
          const stickyValue = window.localStorage.getItem(key);
          return stickyValue !== null ? JSON.parse(stickyValue) : defaultValue;
        } catch {
          return defaultValue;
        }
      });
      useEffect(() => {
        try {
          window.localStorage.setItem(key, JSON.stringify(value));
        } catch {}
      }, [key, value]);
      return [value, setValue];
    }

    // --- RFC 4180 Robust CSV Parser ---
    function parseCSV(text) {
      const rows = [];
      let row = [''];
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i + 1];
        if (c === '"') {
          if (inQuotes && next === '"') {
            row[row.length - 1] += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (c === ',' && !inQuotes) {
          row.push('');
        } else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && next === '\n') i++;
          rows.push(row);
          row = [''];
        } else {
          row[row.length - 1] += c;
        }
      }
      if (row.length > 1 || row[0] !== '') rows.push(row);
      return rows;
    }

    // --- Urgency Countdown Helper ---
    function getUrgencyCountdown(dueDateStr) {
      if (!dueDateStr) return { text: 'No due date', isOverdue: false, isToday: false, isSoon: false };
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const parts = dueDateStr.split('-').map(Number);
      if (parts.length < 3) return { text: dueDateStr, isOverdue: false, isToday: false, isSoon: false };
      const due = new Date(parts[0], parts[1] - 1, parts[2]);
      due.setHours(0, 0, 0, 0);
      const diffDays = Math.ceil((due.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));

      if (diffDays < 0) return { text: `Overdue by ${Math.abs(diffDays)}d`, isOverdue: true, isToday: false, isSoon: false };
      if (diffDays === 0) return { text: 'Due today! ⚡', isOverdue: false, isToday: true, isSoon: true };
      if (diffDays === 1) return { text: 'Due tomorrow', isOverdue: false, isToday: false, isSoon: true };
      if (diffDays <= 3) return { text: `Due in ${diffDays} days`, isOverdue: false, isToday: false, isSoon: true };
      if (diffDays <= 7) return { text: `Due in ${diffDays} days`, isOverdue: false, isToday: false, isSoon: false };
      const weeks = Math.floor(diffDays / 7);
      return { text: `Due in ${weeks}w`, isOverdue: false, isToday: false, isSoon: false };
    }

            parsed.push({
              id: existing ? existing.id : Date.now() + i,
              title,
              category,
              priority,
              due_date,
              source,
              completed,
              notes: notesVal
            });
          }

          if (parsed.length > 0) {
            setTasks(parsed);
            const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            setLastSyncTime(now);
            setSyncStatus(`Live (${parsed.length} tasks)`);
            if (manual) alert(`Paws-itive! Successfully synced ${parsed.length} tasks from Master Google Sheet.`);
          }
        } catch (err) {
          setSyncStatus('Local Mode');
          if (manual) alert(`Sheet notice: ${err.message || 'Check network connection'}`);
        }
      }, [sheetUrl, tasks, setTasks, setLastSyncTime]);

      useEffect(() => {
        if (autoSync) syncFromGoogleSheet(false);
      }, []);

      // Export tasks as CSV
      const exportCSV = () => {
        let csv = 'Task Title,Category,Priority,Due Date,Source,Status,Notes\r\n';
        tasks.forEach(t => {
          const row = [
            `"${(t.title || '').replace(/"/g, '""')}"`,
            `"${(t.category || '').replace(/"/g, '""')}"`,
            `"${(t.priority || '').replace(/"/g, '""')}"`,
            `"${(t.due_date || '').replace(/"/g, '""')}"`,
            `"${(t.source || '').replace(/"/g, '""')}"`,
            `"${t.completed ? 'Completed' : 'Pending'}"`,
            `"${(t.notes || '').replace(/"/g, '""')}"`
          ];
          csv += row.join(',') + '\r\n';
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', 'lemon_stain_tasks_export.csv');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Import CSV
      const importCSV = (file) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const text = e.target.result;
          const rows = parseCSV(text);
          let headerIdx = -1;
          for (let i = 0; i < rows.length; i++) {
            if (rows[i].some(cell => cell.trim().toLowerCase() === 'task title')) {
              headerIdx = i;
              break;
            }
          }
          if (headerIdx === -1) {
            alert("CSV error: 'Task Title' column not found.");
            return;
          }
          const headers = rows[headerIdx].map(h => h.trim().toLowerCase());
          const titleCol = headers.indexOf('task title');
          const catCol = headers.indexOf('category');
          const prioCol = headers.indexOf('priority');
          const dueCol = headers.indexOf('due date');
          const srcCol = headers.indexOf('source');
          const statusCol = headers.indexOf('status');
          const notesCol = headers.indexOf('notes');

          const imported = [];
          for (let i = headerIdx + 1; i < rows.length; i++) {
            const row = rows[i];
            const title = titleCol !== -1 && row[titleCol] ? row[titleCol].trim() : '';
            if (!title) continue;
            imported.push({
              id: Date.now() + i,
              title,
              category: catCol !== -1 && row[catCol] ? row[catCol].trim() : 'Grad School',
              priority: prioCol !== -1 && row[prioCol] ? row[prioCol].trim() : 'Purr-fect',
              due_date: dueCol !== -1 && row[dueCol] ? row[dueCol].trim() : '2026-09-04',
              source: srcCol !== -1 && row[srcCol] ? row[srcCol].trim() : 'Imported CSV',
              completed: statusCol !== -1 && row[statusCol] ? row[statusCol].trim().toLowerCase() === 'completed' : false,
              notes: notesCol !== -1 && row[notesCol] ? row[notesCol].trim() : ''
            });
          }
          if (imported.length > 0) {
            setTasks([...imported, ...tasks]);
            alert(`Paws-itive! Imported ${imported.length} tasks from CSV.`);
          }
        };
        reader.readAsText(file);
      };

      // Greeting
      const hour = time.getHours();
      const greeting = hour >= 5 && hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : hour < 22 ? 'Good evening' : 'Late night focus';

      return (

                  >
                    <span>🐈‍⬛</span>

                      🐾

                <div>

                    {greeting}, Aretta ✨
                  </h1>

          </nav>

          {/* Tab 1: Overview */}

    function SprintVelocityWidget({ tasks, habits, focusPaws }) {

      return (

          <div className="grid grid-cols-3 gap-2 pt-1 text-center">

          priority: newPriority,

        setTasks(tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
      };

        setTasks(tasks.filter(t => t.id !== id));

        if (search.trim()) {
          const q = search.toLowerCase();

      const toggleDay = (id, idx) => {
        setHabits(habits.map(h => {
          if (h.id === id) {
            const next = [...h.days];
            next[idx] = !next[idx];
            return { ...h, days: next, streak: next.filter(Boolean).length };
          }
          return h;
        }));
      };

      const addHabit = () => {
        const name = prompt('Habit name:');
        if (!name) return;
        setHabits([...habits, { id: Date.now(), name, icon: '🐾', days: [false, false, false, false, false, false, false], streak: 0 }]);
      };

      return (
        <div className="bg-white/90 dark:bg-[#1E1B24]/90 backdrop-blur-md p-6 rounded-3xl border border-cat-200/80 dark:border-stone-800 shadow-cozy dark:shadow-stain space-y-4">

    function PurrModoroMini({ onOpenFull, onPawsEarned }) {
      const [seconds, setSeconds] = useState(25 * 60);
      const [isActive, setIsActive] = useState(false);

      useEffect(() => {
        let timer = null;
        if (isActive && seconds > 0) {
          timer = setInterval(() => setSeconds(s => s - 1), 1000);
        } else if (seconds === 0) {
          setIsActive(false);
          playPurrChime();
          onPawsEarned();
          alert('Meow! Focus sprint complete. Lemon & Stain approve! 🐾');
        }
        return () => clearInterval(timer);
      }, [isActive, seconds]);

      const format = (s) => {
        const m = Math.floor(s / 60);
        const sec = s % 60;
        return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
      };

      return (
        <div className="bg-gradient-to-br from-cat-500 via-amber-600 to-cat-600 text-white p-6 rounded-3xl shadow-cozy space-y-4">
          <div className="flex items-center justify-between">
            <h3 className="font-bold text-xs uppercase tracking-wider font-cozy text-white/90">🐾 Purr-modoro Focus</h3>
            <button onClick={onOpenFull} className="text-xs font-semibold underline text-cat-100 hover:text-white cursor-pointer">
              Full Hub →
            </button>
          </div>
          <div className="text-center py-1">
            <div className="text-4xl font-black font-mono tracking-tight">{format(seconds)}</div>
            <p className="text-xs text-cat-100 mt-1">25m Sprint with Lemon & Stain</p>
          </div>
          <div className="flex justify-center gap-2">
            <button
              onClick={() => setIsActive(!isActive)}
              className="px-4 py-2 rounded-xl bg-white text-cat-800 font-extrabold text-xs hover:bg-cat-50 shadow-sm cursor-pointer"
            >
              {isActive ? 'Pause' : 'Start Focus 🐾'}
            </button>
            <button
              onClick={() => { setIsActive(false); setSeconds(25 * 60); }}
              className="px-3 py-2 rounded-xl bg-cat-700/50 text-white font-semibold text-xs hover:bg-cat-700 cursor-pointer"
            >
              Reset
            </button>
          </div>
        </div>
      );
    }

                    </div>
                    <div>
                      <label className="font-bold block mb-1">Category</label>
                      <select value={newCat} onChange={e => setNewCat(e.target.value)} className="w-full p-2.5 rounded-xl bg-cat-50/60 dark:bg-stone-800 border border-cat-200 dark:border-stone-700">
                        <option value="Academic">🎓 Academic</option>
                        <option value="Work">💼 Work</option>
                        <option value="Bills">💳 Bills</option>
                        <option value="Wellness">🧘‍♀️ Wellness</option>
                        <option value="Personal">🏡 Personal</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="font-bold block mb-1">Location</label>
                    <input type="text" placeholder="Hagfors 151, Lake Elmo, Zoom" value={newLoc} onChange={e => setNewLoc(e.target.value)} className="w-full p-2.5 rounded-xl bg-cat-50/60 dark:bg-stone-800 border border-cat-200 dark:border-stone-700" />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowAdd(false)} className="px-4 py-2 rounded-xl bg-cat-50 dark:bg-stone-800 font-bold">Cancel</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-cat-500 text-white font-bold">Save Event</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    function StudySuiteView({ notes, setNotes, assignments, setAssignments, onPawsEarned }) {
      const [seconds, setSeconds] = useState(25 * 60);
      const [totalSec, setTotalSec] = useState(25 * 60);
      const [isRunning, setIsRunning] = useState(false);
      const [mode, setMode] = useState('focus');

      useEffect(() => {
        let timer = null;
        if (isRunning && seconds > 0) {
          timer = setInterval(() => setSeconds(s => s - 1), 1000);
        } else if (seconds === 0) {
          setIsRunning(false);
          playPurrChime();
          if (mode === 'focus') onPawsEarned();
          alert(`${mode === 'focus' ? 'Focus block' : 'Catnap'} finished! Meow! 🐾`);
        }
        return () => clearInterval(timer);
      }, [isRunning, seconds, mode]);

      const changeMode = (m, mins) => {
        setMode(m);
        setIsRunning(false);
        setSeconds(mins * 60);
        setTotalSec(mins * 60);
      };

      const format = (s) => {
        const m = Math.floor(s / 60);
        const sec = s % 60;
        return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
      };

      const radius = 90;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - ((totalSec - seconds) / totalSec) * circumference;

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            {/* Focus Den Ring */}
            <div className="md:col-span-1 bg-white/90 dark:bg-[#1E1B24]/90 backdrop-blur-md p-6 rounded-3xl border border-cat-200/80 dark:border-stone-800 shadow-cozy flex flex-col items-center text-center space-y-4">
              <h2 className="text-xl font-bold font-cozy">🐾 Purr-modoro Focus Den</h2>
              <div className="flex bg-cat-50 dark:bg-stone-800 p-1.5 rounded-2xl gap-1 text-xs font-bold">
                <button onClick={() => changeMode('focus', 25)} className={`px-3 py-1.5 rounded-xl ${mode === 'focus' ? 'bg-cat-500 text-white' : 'text-stone-500'}`}>Focus (25m)</button>
                <button onClick={() => changeMode('short', 5)} className={`px-3 py-1.5 rounded-xl ${mode === 'short' ? 'bg-cat-500 text-white' : 'text-stone-500'}`}>Nap (5m)</button>
                <button onClick={() => changeMode('long', 15)} className={`px-3 py-1.5 rounded-xl ${mode === 'long' ? 'bg-cat-500 text-white' : 'text-stone-500'}`}>Long (15m)</button>
              </div>

              {/* SVG Ring */}
              <div className="relative flex items-center justify-center my-2">
                <svg className="w-52 h-52 transform -rotate-90" viewBox="0 0 200 200">
                  <circle cx="100" cy="100" r={radius} stroke="currentColor" strokeWidth="8" fill="transparent" className="text-cat-100 dark:text-stone-800" />
                  <circle cx="100" cy="100" r={radius} stroke="currentColor" strokeWidth="8" strokeDasharray={circumference} strokeDashoffset={offset} strokeLinecap="round" fill="transparent" className="text-cat-500 transition-all duration-500" />
                </svg>
                <div className="absolute inset-0 flex flex-col items-center justify-center">
                  <span className="text-4xl font-black font-mono tracking-tight">{format(seconds)}</span>
                  <span className="text-[11px] font-bold text-cat-600 mt-1 uppercase">{mode === 'focus' ? 'Sprint' : 'Rest'}</span>
                </div>
              </div>

              <div className="flex gap-2">
                <button onClick={() => setIsRunning(!isRunning)} className="px-6 py-2.5 rounded-xl bg-cat-500 hover:bg-cat-600 text-white font-bold text-xs shadow-xs">
                  {isRunning ? 'Pause' : 'Start Sprint'}
                </button>
                <button onClick={() => { setIsRunning(false); setSeconds(totalSec); }} className="px-4 py-2.5 rounded-xl bg-cat-50 dark:bg-stone-800 font-bold text-xs">
                  Reset
                </button>
                <button onClick={playPurrChime} className="px-3 py-2.5 rounded-xl bg-cat-50 dark:bg-stone-800 font-bold text-xs" title="Test audio bell">
                  🔔
                </button>
              </div>
            </div>

            {/* Course Assignments Table */}
            <div className="md:col-span-2 bg-white/90 dark:bg-[#1E1B24]/90 backdrop-blur-md p-6 rounded-3xl border border-cat-200/80 dark:border-stone-800 shadow-cozy space-y-4">
              <div className="flex items-center justify-between">
                <div>
                  <h2 className="text-lg font-bold font-cozy">Augsburg MSW Course Milestones</h2>
                  <p className="text-xs text-stone-400">Clinical Practicum & Academic Deliverables</p>
                </div>
                <button
                  onClick={() => {
                    const name = prompt('Assignment Name:');
                    const course = prompt('Course Code (e.g. AOCP Individuals):');
                    if (name && course) {
                      setAssignments([...assignments, { id: Date.now(), course, prof: 'Faculty', name, due: 'Soon', weight: '20%', status: 'Not Started' }]);
                    }
                  }}
                  className="text-xs font-bold text-cat-600 hover:underline cursor-pointer"
                >
                  + Add Assignment
                </button>
              </div>

              <div className="overflow-x-auto custom-scrollbar">
                <table className="w-full text-left text-xs">
                  <thead>
                    <tr className="border-b border-cat-100 dark:border-stone-800 text-stone-400 font-bold">
                      <th className="pb-2">Course</th>
                      <th className="pb-2">Professor</th>
                      <th className="pb-2">Assignment</th>
                      <th className="pb-2">Due Date</th>
                      <th className="pb-2">Weight</th>
                      <th className="pb-2">Status</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-cat-50 dark:divide-stone-800/60">
                    {assignments.map(a => (
                      <tr key={a.id} className="hover:bg-cat-50/50 dark:hover:bg-stone-800/30">
                        <td className="py-3 font-bold text-cat-700 dark:text-cat-400">{a.course}</td>
                        <td className="py-3 text-stone-500">{a.prof}</td>
                        <td className="py-3 font-semibold">{a.name}</td>
                        <td className="py-3 text-stone-400">{a.due}</td>
                        <td className="py-3 text-stone-400">{a.weight}</td>
                        <td className="py-3">
                          <span className="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 dark:bg-amber-950/60 text-amber-700 dark:text-amber-400">
                            {a.status}
                          </span>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          {/* Full Scratchpad */}
          <div className="bg-white/90 dark:bg-[#1E1B24]/90 backdrop-blur-md p-6 rounded-3xl border border-cat-200/80 dark:border-stone-800 shadow-cozy space-y-2">
            <h2 className="text-lg font-bold font-cozy">Clinical & Field Practicum Scratchpad</h2>
            <textarea
              value={notes}
              onChange={e => setNotes(e.target.value)}
              rows={8}
              className="w-full text-xs p-4 rounded-2xl bg-cat-50/50 dark:bg-stone-800/40 border border-cat-200 dark:border-stone-700 font-mono leading-relaxed focus:outline-none focus:ring-2 focus:ring-cat-400"
            />
          </div>
        </div>
      );
    }

    function IntegrationsHubView({ tasks, sheetUrl, setSheetUrl, syncStatus, lastSyncTime, autoSync, setAutoSync, onSyncNow, onExportCSV, onImportCSV }) {
      const fileInput = useRef(null);

      return (
        <div className="bg-white/90 dark:bg-[#1E1B24]/90 backdrop-blur-md p-6 rounded-3xl border border-cat-200/80 dark:border-stone-800 shadow-cozy space-y-6">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h2 className="text-xl font-bold font-cozy">Live Dynamic Sync & Data Feeds</h2>
              <p className="text-xs text-stone-500">Connected to your Master Google Sheet with local browser persistence.</p>
            </div>
            <div className="flex items-center gap-2 flex-wrap">
              <button
                onClick={onExportCSV}
                className="px-3.5 py-2 rounded-2xl bg-cat-50 dark:bg-stone-800 border border-cat-200 dark:border-stone-700 text-xs font-bold hover:bg-cat-100 flex items-center gap-1.5 shadow-2xs cursor-pointer"
              >
                📥 Export CSV
              </button>
              <input
                type="file"
                ref={fileInput}
                accept=".csv"
                className="hidden"
                onChange={e => e.target.files && e.target.files[0] && onImportCSV(e.target.files[0])}
              />
              <button
                onClick={() => fileInput.current && fileInput.current.click()}
                className="px-3.5 py-2 rounded-2xl bg-cat-50 dark:bg-stone-800 border border-cat-200 dark:border-stone-700 text-xs font-bold hover:bg-cat-100 flex items-center gap-1.5 shadow-2xs cursor-pointer"
              >
                📤 Import CSV
              </button>
              <button
                onClick={onSyncNow}
                className="px-4 py-2 rounded-2xl bg-cat-500 text-white text-xs font-bold shadow-xs cursor-pointer"
              >
                🔄 Sync Sheet Now
              </button>
            </div>
          </div>

          <div className="p-5 rounded-3xl bg-cat-50/60 dark:bg-stone-800/50 border border-cat-200 dark:border-stone-700 space-y-3">
            <div className="flex items-center justify-between flex-wrap gap-2">
              <div className="flex items-center gap-2">
                <span className="text-2xl">📊</span>
                <div>
                  <h3 className="text-sm font-bold text-cat-900 dark:text-cat-300">Google Sheet Dynamic Feed Connection</h3>
                  <p className="text-[11px] text-stone-500">Status: <strong>{syncStatus}</strong> {lastSyncTime && `• Last Synced: ${lastSyncTime}`}</p>
                </div>
              </div>
              <label className="flex items-center gap-2 text-xs font-semibold cursor-pointer">
                <input
                  type="checkbox"
                  checked={autoSync}
                  onChange={e => setAutoSync(e.target.checked)}
                  className="rounded text-cat-500"
                />
                Auto-sync on page load
              </label>
            </div>

            <div>
              <label className="text-[11px] font-bold block mb-1">Connected Sheet CSV URL:</label>
              <input
                type="text"
                value={sheetUrl}
                onChange={e => setSheetUrl(e.target.value)}
                className="w-full text-xs p-2.5 rounded-xl bg-white dark:bg-stone-900 border border-cat-200 dark:border-stone-700 font-mono"
              />
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
            {[
              { name: 'Master Task Tracker Google Sheet', desc: 'Auto-syncs active assignments and deadlines', status: syncStatus, icon: '📊' },
              { name: 'Augsburg MSW Moodle & Calendar', desc: 'Clinical courses, seminars, and forum deadlines', status: 'Active (Augsburg Feed)', icon: '🎓' },
              { name: 'CARE Counseling Practicum', desc: 'Orientation, Mendota Heights training, supervision', status: 'Active (CARE Feed)', icon: '🏥' },
              { name: 'Universal Home Health Care (UHHC)', desc: 'Bi-weekly payroll milestones & clinical shifts', status: 'Active (UHHC Feed)', icon: '💼' },
            ].map((item, idx) => (
              <div key={idx} className="p-4 rounded-2xl border border-cat-100 dark:border-stone-800 bg-cat-50/40 dark:bg-stone-800/30 flex items-start gap-3">
                <span className="text-2xl p-2 rounded-2xl bg-white dark:bg-stone-800 shadow-2xs">{item.icon}</span>
                <div className="flex-1">
                  <div className="flex items-center justify-between">
                    <h4 className="font-bold">{item.name}</h4>
                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 font-bold">{item.status}</span>
                  </div>
                  <p className="text-stone-500 mt-1">{item.desc}</p>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
