# One file for local runs and the VPS.
#   Local:  docker compose up -d --build
#   VPS:    images come from GHCR (scripts/deploy.sh sets IMAGE_TAG)
name: lemon-stain

services:
  api:
    image: ${REGISTRY:-ghcr.io/benwhann}/lemon-stain-api:${IMAGE_TAG:-local}
    build:
      context: ./backend
    container_name: lemon-stain-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: sqlite:////data/dashboard.db
      CORS_ORIGINS: ""
      DEFAULT_SHEET_URL: ${DEFAULT_SHEET_URL:-}
      AUTO_SYNC_ENABLED: ${AUTO_SYNC_ENABLED:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DISPLAY_NAME: ${DISPLAY_NAME:-Aretta}
    volumes:
      - api_data:/data
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    image: ${REGISTRY:-ghcr.io/benwhann}/lemon-stain-web:${IMAGE_TAG:-local}
    build:
      context: ./frontend
    container_name: lemon-stain-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

networks:
  internal:

volumes:
  # SQLite lives in a named volume so file ownership is always right for the
  # unprivileged API user. Back it up with scripts/backup.sh.
  api_data:
  caddy_data:
  caddy_config:
