name: Deploy to VPS

# Every push to main is tested, built into images, pushed to GitHub Container
# Registry, and rolled out on the Hostinger VPS. The VPS never builds anything.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and push images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      registry: ${{ steps.meta.outputs.registry }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.meta.outputs.registry }}/lemon-stain-api:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.registry }}/lemon-stain-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.registry }}/lemon-stain-web:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.registry }}/lemon-stain-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Roll out on the VPS
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      APP_DIR: /opt/lemon-stain
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        env:
          HOST: ${{ secrets.VPS_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing VPS_HOST"
          [ -n "$KEY" ] || missing="$missing VPS_SSH_KEY"
          [ -n "$KNOWN" ] || missing="$missing VPS_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets before deploying:$missing (see README > Deploying)."
            exit 1
          fi

      - name: Set up SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host keys: no trust-on-first-use
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts

      - name: Upload compose file and scripts
        env:
          HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER || 'deploy' }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          scp -i ~/.ssh/deploy_key -P "$PORT" docker-compose.yml .env.example "$SSH_USER@$HOST:$APP_DIR/"
          scp -i ~/.ssh/deploy_key -P "$PORT" scripts/*.sh "$SSH_USER@$HOST:$APP_DIR/scripts/"

      - name: Pull and restart
        env:
          HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER || 'deploy' }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          REGISTRY: ${{ needs.publish.outputs.registry }}
          TAG: ${{ needs.publish.outputs.tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          remote() { ssh -i ~/.ssh/deploy_key -p "$PORT" "$SSH_USER@$HOST" "$@"; }
          # The short-lived job token goes over stdin, never onto a command line,
          # and only lets the VPS pull for the length of this job.
          printf '%s' "$GHCR_TOKEN" | remote "docker login ghcr.io -u '$GHCR_USER' --password-stdin" >/dev/null
          set +e
          remote "cd $APP_DIR && chmod +x scripts/*.sh \
            && { grep -q '^REGISTRY=' .env && sed -i 's#^REGISTRY=.*#REGISTRY=$REGISTRY#' .env || echo 'REGISTRY=$REGISTRY' >> .env; } \
            && ./scripts/deploy.sh '$TAG'"
          status=$?
          set -e
          remote "docker logout ghcr.io" >/dev/null 2>&1 || true
          exit $status

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
